# Example nginx site for cards.heavyroad.nl. nginx terminates TLS and proxies to the app
# container, published on 127.0.0.1:8100 by docker-compose.yml. Adjust the certificate paths
# to the host's setup.

server {
    listen 80;
    server_name cards.heavyroad.nl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cards.heavyroad.nl;

    ssl_certificate     C:/nginx/certs/cards.heavyroad.nl/fullchain.pem;
    ssl_certificate_key C:/nginx/certs/cards.heavyroad.nl/privkey.pem;

    # Artwork uploads are at most 10 MB; leave room for the multipart overhead.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app reads the real client IP from this header (the Collection allowlist depends
        # on it). It trusts the header only from the Docker gateway network.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
